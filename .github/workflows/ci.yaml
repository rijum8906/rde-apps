name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test, build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze every package and app
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test packages
        run: |
          for package in packages/*; do
            echo "::group::flutter test $package"
            (cd "$package" && flutter test)
            echo "::endgroup::"
          done

      - name: Test apps
        run: |
          for app in apps/*; do
            echo "::group::flutter test $app"
            (cd "$app" && flutter test)
            echo "::endgroup::"
          done

      - name: Build Linux apps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev ninja-build
          for app in apps/*; do
            echo "::group::flutter build linux --debug $app"
            (cd "$app" && flutter build linux --debug)
            echo "::endgroup::"
          done
