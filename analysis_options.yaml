# Shared analyzer configuration for every workspace member.
#
# `very_good_analysis` is a strict superset of most of `flutter_lints`, but the
# Flutter-specific rules are kept explicitly so both rule sets are enforced
# (as required by the workspace contract).
include:
  - package:flutter_lints/flutter.yaml
  - package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/generated/**"
    - "**/.dart_tool/**"
    - "**/build/**"

linter:
  rules:
    always_use_package_imports: true
    avoid_print: true
    prefer_single_quotes: true
    public_member_api_docs: true
    require_trailing_commas: true
    unawaited_futures: true
