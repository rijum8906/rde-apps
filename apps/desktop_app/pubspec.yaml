version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  app_localization:
    path: ../../packages/app_localization
  app_routing:
    path: ../../packages/app_routing
  app_shared:
